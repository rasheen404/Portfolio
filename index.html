        try { t = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (e) {}

        d.dataset.theme = t;
        d.classList.add('js');
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f5f2');
      })();
    </script>

    <!-- Google tag (gtag.js) — events queue immediately; the library loads on the first

      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-W0BC0HSDXD');
      (function () {
        var loaded = false, evts = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
        function go() {
          if (loaded) return;
          loaded = true;
          evts.forEach(function (e) { removeEventListener(e, go, true); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-W0BC0HSDXD';
          document.head.appendChild(s);
        }
        evts.forEach(function (e) { addEventListener(e, go, { capture: true, passive: true, once: true }); });
        addEventListener('load', function () { setTimeout(go, 6000); });
      })();
